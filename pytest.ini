[pytest]
# Direct mode (tests/direct): in-memory GenVM, no network, ~1 min.
# Integration (tests/integration): full consensus on a live network. Those tests
# skip when no network answers; `make test-integration` makes that a failure.
testpaths = tests/direct tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra -p no:cacheprovider
markers =
    integration: requires a live GenLayer network (GLSim, localnet or Studio Devnet)
